version: '3.8'
services:
  db:
    image: postgres:15-alpine
    container_name: aitek_crm_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: aitek_secure_pass
      POSTGRES_DB: aitek_crm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: